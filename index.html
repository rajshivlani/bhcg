			const getUA = () => {
				let device = "Unknown";
				const ua = {
					"Generic Linux": /Linux/i,

					"BlackBerry": /BlackBerry/i,
					"Bluebird": /EF500/i,
					"Chrome OS": /CrOS/i,
					"Datalogic": /DL-AXIS/i,
					"Honeywell": /CT50/i,
					"iPad": /iPad/i,
					"iPhone": /iPhone/i,
					"iPod": /iPod/i,
					"macOS": /Macintosh/i,
					"Windows": /IEMobile|Windows/i,
					"Zebra": /TC70|TC55/i,
				}
				Object.keys(ua).map(v => navigator.userAgent.match(ua[v]) && (device = v));
				return device;
			}

			console.log(getUA());
